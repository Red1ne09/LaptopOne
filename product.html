<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 90%;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .product-details {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .image-slider {
            position: relative;
            max-width: 600px;
            width: 100%;
            margin-bottom: 20px;
        }
        .slide {
            display: none;
            width: 100%;
        }
        .slide img {
            width: 100%;
            border-radius: 8px;
        }
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.3s ease;
            border-radius: 3px;
            user-select: none;
        }
        .prev {
            left: 0;
            background-color: rgba(0,0,0,0.5);
        }
        .next {
            right: 0;
            background-color: rgba(0,0,0,0.5);
        }
        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }
        .product-info {
            text-align: center;
            max-width: 600px;
        }
        .product-info h2 {
            margin: 0 0 10px 0;
            font-size: 1.5em;
            color: #333;
        }
        .price {
            font-size: 1.5em;
            color: #27ae60;
        }
        .condition {
            font-size: 1em;
            color: #888;
            margin: 10px 0;
        }
        .description {
            font-size: 1em;
            color: #555;
            margin-top: 20px;
            line-height: 1.6;
            text-align: left;
        }
        .contact-section {
            margin-top: 30px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
        }
        .contact-section h2 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #333;
        }
        .contact-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .contact-buttons a {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }
        .contact-buttons .instagram {
            background-color: #cd486b;
            color: #fff;
        }

        .contact-buttons .instagram:hover {
            background-color: #b93f5f;
        }

        .contact-buttons .whatsapp {
            background-color: #25d366;
        }
        .contact-buttons .whatsapp:hover {
            background-color: #1ebe5b;
        }
        .contact-buttons .email {
            background-color: #3498db;
        }
        .contact-buttons .email:hover {
            background-color: #2980b9;
        }
        .contact-form {
            margin: 0 auto;
            margin-top: 20px;
        }
        .contact-form input,
        .contact-form textarea,
        .contact-form button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }
        .contact-form button {
            background-color: #3498db;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .contact-form button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="home-button">Home</a>
        <h1>Product Details</h1>
        <div class="product-details">
            <div class="image-slider" id="image-slider">
                <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
                <a class="next" onclick="changeSlide(1)">&#10095;</a>
            </div>
            <div class="product-info">
                <h2 id="product-name">Laptop Model</h2>
                <p class="price" id="product-price">$899.99</p>
                <p class="condition" id="product-condition">Condition: New</p>
                <p class="description" id="product-description">
                    This laptop features the latest technology with a high-resolution display, fast processor, and ample storage space.
                </p>
            </div>
        </div>
        
        <div class="contact-section">
            <h2>Contact the Seller</h2>
            <div class="contact-buttons">
                <a href="https://wa.me/1234567890" class="whatsapp" target="_blank">WhatsApp</a>
                <a href="mailto:seller@example.com" class="email" target="_blank">Email</a>
                <a href="https://www.instagram.com/red_1ne_09/" class="instagram" target="_blank">Instagram</a>
            </div>
            
            <form class="contact-form" action="https://formspree.io/f/xovvkbko" method="POST">
                <input type="hidden" name="product_id" id="product-id" value="default_id">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
            
        </div>
    </div>

    <script>
        const productData = {
            '1': {
                name: 'ASUS ROG Strix G17',
                price: '335000DA',
                condition: 'Condition: New',
                description: `This ASUS ROG laptop features a Ryzen 9 processor, powerful graphics, and a sleek design.`,
                images: [
                    'https://deystore.dz/wp-content/uploads/2024/12/ROG-1.jpg',
                    'https://deystore.dz/wp-content/uploads/2024/12/ROG-2.jpg',
                    'https://deystore.dz/wp-content/uploads/2024/12/ROG-3.jpg'
                ]
            }
        };

        let slideIndex = 0;

        const params = new URLSearchParams(window.location.search);
        const productNumber = params.get('product');

        const data = productData[productNumber] || {};
        document.getElementById('product-name').textContent = data.name || 'Product Not Found';
        document.getElementById('product-price').textContent = data.price || 'N/A';
        document.getElementById('product-condition').textContent = data.condition || 'N/A';
        document.getElementById('product-description').innerText = data.description || 'No description available.';

        const imageSlider = document.getElementById('image-slider');
        if (data.images && data.images.length > 0) {
            data.images.forEach((imageUrl, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                slideDiv.style.display = index === 0 ? 'block' : 'none';
                slideDiv.innerHTML = `<img src="${imageUrl}" alt="Laptop Image ${index + 1}">`;
                imageSlider.insertBefore(slideDiv, imageSlider.querySelector('.next'));
            });
        }

        function showSlides() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                slide.style.display = index === slideIndex ? 'block' : 'none';
            });
        }

        function changeSlide(n) {
            const slides = document.querySelectorAll('.slide');
            slideIndex += n;
            if (slideIndex >= slides.length) slideIndex = 0;
            if (slideIndex < 0) slideIndex = slides.length - 1;
            showSlides();
        }

        showSlides();

        function sendMessage(event) {
            event.preventDefault();
            const name = document.getElementById('user-name').value;
            const email = document.getElementById('user-email').value;
            const message = document.getElementById('user-message').value;

            alert(`Message sent! Name: ${name}, Email: ${email}, Message: ${message}`);
        }

        function ChangeDefaultID(){
            // Example: Get product ID from URL query parameters
            const parameters = new URLSearchParams(window.location.search);
            const productId = parameters.get('product') || 'default_id';
    
            // Set the product ID in the hidden input field
            document.getElementById('product-id').value = productId;
        }
        ChangeDefaultID();

    </script>
</body>
</html>
