<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 90%;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .product-details {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .image-slider {
            position: relative;
            max-width: 600px;
            width: 100%;
            margin-bottom: 20px;
        }
        .slide {
            display: none;
            width: 100%;
        }
        .slide img {
            width: 100%;
            border-radius: 8px;
        }
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.3s ease;
            border-radius: 3px;
            user-select: none;
        }
        .prev {
            left: 0;
            background-color: rgba(0,0,0,0.5);
        }
        .next {
            right: 0;
            background-color: rgba(0,0,0,0.5);
        }
        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }
        .product-info {
            text-align: center;
            max-width: 600px;
        }
        .product-info h2 {
            margin: 0 0 10px 0;
            font-size: 1.5em;
            color: #333;
        }
        .price {
            font-size: 1.5em;
            color: #27ae60;
        }
        .condition {
            font-size: 1em;
            color: #888;
            margin: 10px 0;
        }
        .description {
            font-size: 1em;
            color: #555;
            margin-top: 20px;
            line-height: 1.6;
            text-align: left;
        }
        .home-button {
            display: block;
            width: 150px;
            padding: 10px;
            margin: 20px auto;
            text-align: center;
            background-color: #3498db;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }
        .home-button:hover {
            background-color: #2980b9;
        }#ig_link{
            color: #fff;
            background-color: #cd0c79;
            text-decoration: none;
            border-radius: 10px;
            min-height: 30 px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="home-button">Home</a>
        <h1>Product Details</h1>
        <div class="product-details">
            <div class="image-slider" id="image-slider">
                <!-- Images will be dynamically inserted here -->
                <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
                <a class="next" onclick="changeSlide(1)">&#10095;</a>
            </div>
            <div class="product-info">
                <h2 id="product-name">Laptop Model</h2>
                <p class="price" id="product-price">$899.99</p>
                <p class="condition" id="product-condition">Condition: New</p>
                <p class="description" id="product-description">
                    This laptop features the latest technology with a high-resolution display, fast processor, and ample storage space.
                </p>
                <h2 id="ig-link">
                    <a id="ig-link" href="#">Contact me for more</a>
                </h2>
            </div>
        </div>
    </div>
    <script>
        // Product data
        const productData = {
            '1': {
                name: 'ASUS ROG Strix G17',
                price: '335000DA',
                condition: 'Condition: New',
                description: `This ASUS ROG laptop features a Ryzen 9 processor, powerful graphics, and a sleek design.`,
                images: [
                    'https://deystore.dz/wp-content/uploads/2024/12/ROG-1.jpg',
                    'https://deystore.dz/wp-content/uploads/2024/12/ROG-2.jpg',
                    'https://deystore.dz/wp-content/uploads/2024/12/ROG-3.jpg'
                ],
                link: 'https://deystore.dz/produit/laptop-asus-rog-strix-g17-amd-ryzen-9-7940hx-16gb-512ssd-4060-8gb-17/'
            }
        };

        // Initialize slide index
        let slideIndex = 0;

        // Fetch product number from query string
        const params = new URLSearchParams(window.location.search);
        const productNumber = params.get('product');

        // Fetch product data
        const data = productData[productNumber] || {};

        // Update product details
        document.getElementById('product-name').textContent = data.name || 'Product Not Found';
        document.getElementById('product-price').textContent = data.price || 'N/A';
        document.getElementById('product-condition').textContent = data.condition || 'N/A';
        document.getElementById('product-description').innerText = data.description || 'The product you are looking for does not exist or has not been added yet.';
        document.getElementById('ig-link').href = data.link || '#';

        // Dynamically generate image slides
        const imageSlider = document.getElementById('image-slider');
        if (data.images && data.images.length > 0) {
            data.images.forEach((imageUrl, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                slideDiv.style.display = index === 0 ? 'block' : 'none'; // Show the first slide initially
                slideDiv.innerHTML = `<img src="${imageUrl}" alt="Laptop Image ${index + 1}">`;
                imageSlider.insertBefore(slideDiv, imageSlider.querySelector('.next'));
            });
        }

        // Show slides
        function showSlides() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                slide.style.display = index === slideIndex ? 'block' : 'none';
            });
        }

        // Change slides
        function changeSlide(n) {
            const slides = document.querySelectorAll('.slide');
            slideIndex += n;
            if (slideIndex >= slides.length) slideIndex = 0;
            if (slideIndex < 0) slideIndex = slides.length - 1;
            showSlides();
        }

        // Initialize the slider
        showSlides();
    </script>
</body>
</html>
