<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            position:relative;
            width: 90%;
            margin: 0 auto;
            padding: 20px;
        }
        h3 {
            text-align: center;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-decoration: none;
            color: inherit;
        } 
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: auto;
            border-bottom: 1px solid #ddd;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h2 {
            margin: 0 0 10px 0;
            font-size: 1.25em;
            color: #333;
        }
        .card-content p {
            margin: 0;
            color: #666;
        }
        .price {
            font-size: 1.5em;
            color: #27ae60;
        }
        .condition {
            font-size: 0.875em;
            color: #888;
        }
        .about-btn {
            display: block;
            width: 200px;
            margin: 0 auto;
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            background-color: #f1c40f;
            color: #110a3d;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight:bolder;

            transition: 200ms;
        }
        .about-btn:hover {
            background-color: #2980b9;
            color:white;
        }
        /*Header*/
        #Header {
            background: linear-gradient(to right, #0c1443, #13042c); /* Sleek blue gradient */
            padding-bottom: 15px;
            color: #fff;
            text-align: center;
            height: fit-content;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Subtle shadow for elevation */
        }
        .Title{
            text-align: center;
            display: flex;
            align-items: center;
        }
        .Logo {
            margin: 0;
            font-size: 1.8em;
            width:100%;
            padding-top: 15px;
            padding-left: 1%;
            text-align: start;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7); /* Slight shadow for depth */
        }
        
        hr {
            width: 50%;
            margin: 15px auto;
            border: 0;
            height: 2px;
            background: #f1c40f; /* Gold underline */
            border-radius: 5px;
        }


        ul {
            list-style-type: none; /* Remove default bullet points */
            padding: 0;
            margin: 0;
        }
        

        ul li {
            display: inline-block; /* Horizontal alignment for a sleek layout */
            margin: 0 10px;
        }
        ul li::before {
            margin-top: 0;
            content: "👌"; /* Add a custom bullet */
            margin-right: 10px;
            font-size: 1.2em;
        }

        hr {
            width: 80%;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #ffffff, transparent); /* Gradient for a modern look */
            margin: 15px 0;
        }

        #o_container {
            background: rgba(255, 255, 255, 0.1); /* Subtle light background */
            border-radius: 5px;
            padding: 20px 30px;
            max-width: 800px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3); /* Add depth */
            text-align: center;
        }

        .o_info {
            font-size: 1.5em;
            font-weight: bold;
            color: #f1c40f; /* Highlight the main message */
            margin: 5px 0;
            text-align: center;
        }
        .o_info ul{
            color: white;
            font-size: 1.2em;
            margin: 10px 0;
            line-height: 1.6;
        }


        ul {
            list-style-type: none; /* Remove default bullet points */
            padding: 0;
        }

        @media only screen and (max-width: 600px) {
            .Logo {
                font-size: 1.2em;
            }
            #Header{
                height: fit-content;
                margin: 0 auto;
                justify-self: center;
                justify-content: center;
            }
            #o_container{
                position: relative;
                margin: 0 auto;
                width: fit-content;
                background-color: rgba(255, 255, 255, 0.2);
            }
            .o_info{
                font-size: 25px;
                color: #f1c40f;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="Header">
        <div class="Title">
            <h1 class="Logo">LAPTOP <strong>ONE</strong></h1>
        </div>
        <hr>
        <div class="container" id="o_container">
            <p class="o_info">Laptops De La Qualité Supérieure Europeéne</li>
            <ul>
                <li>Services Aprés Vente</li>
                <li>Dés Prix Imbatables</li>
                <li>Livraison Gratuite</li>
            </ul>
            <a href="about.html" class="about-btn">Qui-étes Nous?</a>
        </div>
    </div>
    <div class="container">
        <h3>EU Products with The best Price & Quality</h3>
        <div class="grid" id="product-grid">

            <a href="product.html?product=1" class="card">
                <img src="https://deystore.dz/wp-content/uploads/2024/12/ROG-1.jpg" alt="ASUS ROG Strix G17">
                <div class="card-content">
                    <h2>ASUS ROG Strix G17</h2>
                    <p class="price">335000DA</p>
                    <p class="condition">Condition: New</p>
                </div>
            </a>
            
            <p>No Products Available Right Now</p>
        </div>
    </div>
</body>
</html>
